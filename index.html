<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Les amis de 10</title>
<!--
  Les amis de 10 — appli élèves de Ludo (@rprof_1), construite sur le gabarit — styles « Couleurs » (doux et illustré) et « Simple » (charte rprof1.com)
  À adapter : APP (titre, version, source), CONTENU, ÉTAPES d'aide, écrans d'activité.
  Ne pas utiliser l'attribut data-theme pour la logique de l'appli (réservé au thème clair/sombre).
-->
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F7F8FB; --surface:#EEF1F6; --card:#FFFFFF; --ink:#1F2933; --muted:#5F6A76; --line:#E0E5EC; --line-strong:#CDD5DF;
  --focus:#3B6FD8; --primary:#3B6FD8; --primary-ink:#FFFFFF;
  --ok:#22804A; --ok-bg:#E3F5E9; --ok-strong:#2FA05C;
  --bad:#B42A20; --bad-bg:#FCE7E5; --bad-strong:#D9473B;
  --sel:#3B6FD8; --sel-bg:#E6EEFC;
  --p-blue:#DCE9FB; --p-lav:#E7E0FA; --p-peach:#FDE5D3; --p-mint:#DCF1E4; --p-yellow:#FAF0C8; --p-rose:#FADDE3; --p-teal:#D3EFEC; --p-gris:#E6EAF0; /* pastels FIXES : identiques en clair et en sombre, toujours avec --tile-ink */
  --lav-ink:#3C3489; --mint-ink:#27500A; --rose-ink:#72243E; --tile-ink:#1F2933;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13181E; --surface:#1F2630; --card:#1A2129; --ink:#ECF0F4; --muted:#A0ABB7; --line:#2C3540; --line-strong:#3A4552;
    --focus:#8AB4F8; --primary:#6F9BF0; --primary-ink:#0F141A;
    --ok:#6FD39A; --ok-bg:#1C3527; --bad:#FF8A80; --bad-bg:#3F201E; --sel:#8AB4F8; --sel-bg:#21324B;
  }
}
:root[data-theme="dark"]{
  --bg:#13181E; --surface:#1F2630; --card:#1A2129; --ink:#ECF0F4; --muted:#A0ABB7; --line:#2C3540; --line-strong:#3A4552;
  --focus:#8AB4F8; --primary:#6F9BF0; --primary-ink:#0F141A;
  --ok:#6FD39A; --ok-bg:#1C3527; --bad:#FF8A80; --bad-bg:#3F201E; --sel:#8AB4F8; --sel-bg:#21324B;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2,h3,p{margin:0;font-weight:normal}
b,strong{font-weight:normal}

/* ---------- Structure ---------- */
#app{height:100%;display:flex;flex-direction:column}
.top{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:14px;padding:12px 16px}
.round{width:48px;height:48px;border-radius:50%;border:0;background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0}
.round svg{width:24px;height:24px}
#topCenter{min-width:0;display:flex;align-items:center;justify-content:center;gap:10px}
.ttl{font-size:17px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:6px;border-radius:99px;background:var(--line);transition:background-color .3s}
.segs i.on{background:var(--primary)}
.streak{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:16px;padding:4px 10px;border-radius:999px;background:var(--p-peach);color:var(--tile-ink);animation:pop .3s}
.streak svg{width:18px;height:18px}
#main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{zoom:var(--z,1);min-height:calc(100% / var(--z,1));max-width:720px;margin:0 auto;padding:8px 20px 28px;display:flex;flex-direction:column;gap:18px}
body.sheet-open .wrap{padding-bottom:220px}
.actions{margin-top:auto;padding-top:8px;display:flex;gap:12px;flex-wrap:wrap}
.actions>*{flex:1 1 200px}
.actions.inline{margin-top:0;padding-top:0}
.home-bottom{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.enter{animation:enterR .28s ease-out}
@keyframes enterR{from{opacity:0;transform:translateX(28px)}}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* ---------- Textes ---------- */
h1{font-size:clamp(30px,5vw,40px);line-height:1.15;letter-spacing:-.015em}
.lead{font-size:20px;color:var(--muted)}
.q-label{font-size:22px;line-height:1.3}
.small-label{font-size:16px;color:var(--muted)}
.badge{align-self:flex-start;display:inline-flex;gap:6px;align-items:center;font-size:15px;padding:5px 12px;border-radius:999px;background:var(--surface);color:var(--muted)}
.word{display:block;font-size:clamp(34px,6vw,46px);font-weight:bold;line-height:1.1}
.def{display:block;font-size:clamp(21px,3vw,24px);line-height:1.5}

/* ---------- Accueil ---------- */
.hero{display:flex;justify-content:flex-start;margin:4px 0 -6px}
.hero svg{width:min(240px,60%);height:auto}
.slines{display:flex;flex-direction:column;gap:10px}
.sline{display:flex;align-items:center;gap:14px;font-size:20px;line-height:1.35;text-align:left}
.sline .ic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--p-lav);display:flex;align-items:center;justify-content:center}
.sline .ic svg{width:28px;height:28px}
.field{display:flex;flex-direction:column;gap:8px;font-size:16px;color:var(--muted)}
.field input{max-width:360px;min-height:54px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:20px Arial,Helvetica,sans-serif}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;min-height:156px;padding:18px;border-radius:26px;border:0;background:var(--c,var(--p-blue));color:var(--tile-ink);transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ico{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center}
.tile .ico svg{width:46px;height:46px}
.tile .name{font-size:22px;margin-top:auto}
.tile .desc{font-size:16px;opacity:.8;line-height:1.35}
.sizes{display:flex;flex-direction:column;gap:8px}
.size-pills{display:flex;gap:8px;flex-wrap:wrap}
.size-pill{min-height:46px;padding:0 16px;border-radius:999px;border:0;background:var(--surface);font-size:16px;display:inline-flex;align-items:center;gap:6px}
.size-pill[aria-pressed="true"]{background:var(--sel-bg);box-shadow:inset 0 0 0 2px var(--sel)}
.foot{margin-top:8px;font-size:13px;line-height:1.6;color:var(--muted);text-align:left}

/* ---------- Boutons ---------- */
.btn{min-height:58px;padding:0 24px;border-radius:999px;border:0;background:var(--surface);font-size:19px;transition:transform .08s}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:default}

/* ---------- Carte définition / question ---------- */
.def-card{display:flex;flex-direction:column;gap:12px;padding:22px 22px 24px;border-radius:24px;background:var(--card);color:var(--ink);border:2px solid var(--line);text-align:left}

/* ---------- Choix (un mot = pastille lavande) ---------- */
.answers{display:grid;gap:12px}
.choice{position:relative;min-height:60px;padding:14px 52px;border-radius:999px;border:2px solid transparent;background:var(--p-lav);color:var(--lav-ink);font-size:22px;text-align:center;transition:background-color .2s,border-color .2s,opacity .2s,transform .08s}
.choice:active:not(:disabled){transform:scale(.98)}
.choice:disabled{cursor:default;color:var(--lav-ink)}
.choice.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.choice.ko{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.choice.ok::after,.choice.ko::after{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:24px}
.choice.ok::after{content:"✓";color:var(--ok)}
.choice.ko::after{content:"✗";color:var(--bad)}
.choice.dim{opacity:.45}
.choice.pop{animation:pop .3s}
.choice.shake{animation:shake .3s}
.choice.vf-yes{background:var(--p-mint);color:var(--mint-ink)}
.choice.vf-no{background:var(--p-rose);color:var(--rose-ink)}

/* ---------- Feuille de résultat (monte du bas) ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;background:var(--ok-bg);transform:translateY(105%);visibility:hidden;transition:transform .28s ease-out,visibility 0s .28s}
.sheet.show{transform:none;visibility:visible;transition:transform .28s ease-out}
.sheet.bad{background:var(--bad-bg)}
.sheet-in{zoom:var(--z,1);max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sheet-msg{display:flex;gap:14px;align-items:center}
.sheet-ico{flex:none;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;background:var(--ok-strong)}
.sheet.bad .sheet-ico{background:var(--bad-strong)}
.sheet-title{font-size:24px;color:var(--ok)}
.sheet.bad .sheet-title{color:var(--bad)}
.sheet-sub{font-size:19px;margin-top:2px}
.sheet-btn{min-height:60px;border-radius:999px;border:0;font-size:20px;color:#fff;background:var(--ok-strong)}
.sheet.bad .sheet-btn{background:var(--bad-strong)}
.sheet-btn:active{transform:scale(.98)}

/* ---------- Récapitulatif ---------- */
.recap{display:flex;flex-direction:column;gap:16px;padding:24px;border-radius:30px;background:var(--card);border:1px solid var(--line)}
.recap-head{display:flex;align-items:center;gap:18px}
.ring{flex:none;width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--ok-strong) calc(var(--p)*1%),var(--line) 0);display:flex;align-items:center;justify-content:center}
.ring span{width:80px;height:80px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border-radius:999px;font-size:17px;color:var(--tile-ink)}
.chip.ok{background:var(--p-mint)} .chip.ko{background:var(--p-rose)}
.tip{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:22px;background:var(--p-yellow);color:var(--tile-ink);font-size:19px}
.tip svg{flex:none;width:34px;height:34px}

/* ---------- Aide pas-à-pas ---------- */
.modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(31,41,51,.28)}
.modal.on{display:flex}
.mbox{zoom:var(--z,1);width:min(620px,100%);max-height:calc(100% / var(--z,1));overflow:auto;background:var(--card);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:16px}
.mtop{display:flex;align-items:center;gap:12px}
.mtop .segs{flex:1}
.mbox h2{font-size:26px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mnav .btn{min-width:130px}
.scount{font-size:16px;color:var(--muted)}

/* Réglages en haut de l'accueil (Style + Taille du texte) */
.reglages{display:flex;flex-wrap:wrap;gap:12px 28px;padding-bottom:4px}
.reglages .size-pill{min-height:44px}
body.simple .hero{display:none}
body.simple .tile{background:var(--surface)!important;border:0}
body.simple .tile .ico{background:#FFFFFF}
body.simple .sline .ic{background:var(--surface)}
body.simple .size-pill[aria-pressed="true"]{color:#FFFFFF;box-shadow:none}
body.simple .def-card{background:#FFFFFF;border:1.5px solid var(--line)}
body.simple .badge,body.simple .tip{background:var(--surface)}
/* Tuile désactivée : le fond reste plein, seul le contenu pâlit (lisible en clair comme en sombre) */
.tile:disabled{cursor:default}
.tile:disabled .ico,.tile:disabled .name,.tile:disabled .desc{opacity:.7}
/* Encadré neutre : fond qui suit le thème, donc texte en --ink (jamais --tile-ink) */
.tip.neutre{background:var(--surface);color:var(--ink)}
body.simple .choice:not(.ok):not(.ko):not(.dim){background:var(--surface)}
body.simple .segs i.on{background:#0A0A0A}
/* Étiquette « Nouveau » à côté du bouton Simple (couleurs fixes, lisibles en clair et en sombre) */
.nouveau{margin-left:8px;padding:1px 8px;border-radius:999px;font-size:12px;line-height:1.6;background:#FAF0C8;color:#1F2933}
/* Ouverture façon rprof1.com : le titre, puis le point tombe, rebondit et se pose (≈ 1,5 s). */
.ouverture{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.ouverture-mot{max-width:14ch;text-align:center;font-family:"Figtree","Avenir Next",Arial,sans-serif;font-size:clamp(44px,9vw,92px);font-weight:600;letter-spacing:-.045em;line-height:1.02;color:var(--ink)}
.ouverture-point{display:inline-block;transform-origin:50% 85%}
/* ---------- Composants de la skill (extraits) ---------- */
.defis{margin-top:4px}
.dnd-msg{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:20px;background:var(--bad-bg);color:var(--ink);font-size:19px;animation:enterR .2s ease-out}
.dnd-msg.ok{background:var(--ok-bg)}
.dnd-msg.info{background:var(--surface)}
.ko-ico{flex:none;width:36px;height:36px;border-radius:50%;background:var(--bad-strong);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.dnd-msg.ok .ko-ico{background:var(--ok-strong)}
.dnd-msg.info .ko-ico{background:var(--primary);color:var(--primary-ink)}
.prog{display:flex;flex-direction:column;gap:12px}
.prow{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:24px;background:var(--card);border:1px solid var(--line)}
.ring.small{width:72px;height:72px}
.ring.small span{width:54px;height:54px;font-size:17px}
.ptxt{display:flex;flex-direction:column;gap:2px}
.pname{font-size:22px}
.maitrise{font-size:16px;padding:2px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok);margin-left:6px;white-space:nowrap}

/* ---------- Les amis de 10 ----------
   Code couleur : bleu = le nombre donné, orange = son ami (ce qui manque pour faire 10). */
:root{--bleu-txt:#1C64B4;--orange-txt:#B4461F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bleu-txt:#7DB6F2;--orange-txt:#F4A585}}
:root[data-theme="dark"]{--bleu-txt:#7DB6F2;--orange-txt:#F4A585}
body.simple{--bleu-txt:#1C64B4;--orange-txt:#B4461F}
.c-bleu{color:var(--bleu-txt)} .c-orange{color:var(--orange-txt)}

/* Cadre de 10 */
.tf-zone{display:flex;flex-direction:column;align-items:center;gap:10px}
.tf-zone:empty{display:none}
.tf{--tfc:40px;display:inline-grid;grid-template-columns:repeat(5,var(--tfc));gap:8px;padding:10px;border-radius:18px;background:var(--card);border:2px solid var(--line-strong)}
.tf i{width:var(--tfc);height:var(--tfc);border-radius:50%;display:block}
.tf .f{background:#378ADD}
.tf .a{background:#F0997B}
.tf .e{border:2.5px dashed var(--muted)}
.tf.anim .f,.tf.anim .a,.tf .grow{animation:dot .34s ease-out backwards;animation-delay:var(--d,0ms)}
@keyframes dot{from{transform:scale(0)}60%{transform:scale(1.2)}}
.note{font-size:20px;text-align:center}

/* Calcul en grand */
.eq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.28em;font-size:clamp(46px,9vw,72px);line-height:1.1;margin:4px 0}
.eq.moyen{font-size:clamp(38px,7vw,54px)}
.box{display:inline-flex;align-items:center;justify-content:center;min-width:1.4em;height:1.3em;padding:0 .12em;border-radius:20px;border:4px dashed #F0997B;color:var(--orange-txt);font-weight:bold}
.box.ok{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ok);animation:pop .3s}
.box.ko{border-style:solid;border-color:var(--bad);background:var(--bad-bg);color:var(--bad);animation:shake .3s}

/* Réponses : nombres à toucher */
.answers.trois{grid-template-columns:repeat(3,1fr)}
.answers.pad{grid-template-columns:repeat(6,1fr);gap:10px}
.choice.num{font-size:34px;min-height:76px;padding:8px 0}
.answers.pad .choice.num{font-size:28px;min-height:64px;border-radius:20px}
.answers.pad .choice::after{right:8px;font-size:18px}

/* Les paires */
.q-label.histoire{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 18px;max-width:620px;margin:0 auto;text-align:left}
.eq.petit{font-size:clamp(34px,6vw,48px)}
.eq-txt{font-size:.6em}
.maze.trois .cell{font-size:clamp(14px,2.1vw,20px)}
.paires{display:grid;gap:12px;grid-template-columns:repeat(var(--cols,4),1fr);width:100%;max-width:620px;margin:0 auto}
.paires .choice.num{aspect-ratio:1;border-radius:28px;font-size:clamp(40px,7vw,56px);padding:0;min-height:0}
.paires .choice.sel{border-color:var(--sel);background:var(--sel-bg);color:var(--ink);transform:translateY(-4px)}
body.simple .paires .choice.sel:not(.ok):not(.ko){background:#F7F7F7;border:3px solid #0A0A0A}

/* Le labyrinthe */
.maze{display:grid;grid-template-columns:repeat(var(--cols,5),1fr);gap:8px;width:100%}
.cell{aspect-ratio:5/4;border-radius:16px;border:2px solid var(--line-strong);background:var(--card);color:var(--ink);font-size:clamp(17px,2.6vw,24px);padding:2px;display:flex;align-items:center;justify-content:center;transition:background-color .2s,border-color .2s,transform .08s}
.cell:active{transform:scale(.97)}
.cell.mark{background:var(--p-yellow);color:var(--tile-ink);border-color:transparent;font-size:clamp(15px,2.2vw,20px)}
.cell.on{background:var(--p-blue);color:var(--tile-ink);border-color:#378ADD;animation:pop .3s}
.cell.mark.on{background:var(--p-blue)}
.cell.last{box-shadow:inset 0 0 0 3px #378ADD}
.cell.ko{background:var(--bad-bg);border-color:var(--bad);color:var(--ink);animation:shake .3s}
.cell.win{background:var(--p-mint);color:var(--tile-ink);border-color:#1D9E75;box-shadow:none;animation:pop .35s ease-out backwards;animation-delay:var(--d,0ms)}

/* Apprendre */
.lecon-top{display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px;border-radius:26px;background:var(--card);border:2px solid var(--line)}
.amis{display:flex;flex-wrap:wrap;gap:10px}
.ami{min-height:52px;padding:6px 18px;border-radius:999px;border:2px solid transparent;background:var(--p-lav);color:var(--lav-ink);font-size:21px;animation:pop .3s backwards;animation-delay:var(--d,0ms)}
.ami[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-bg);color:var(--ink)}
body.simple .ami{background:#FFFFFF;border:1px solid var(--line-strong);color:var(--ink)}
body.simple .ami[aria-pressed="true"]{background:#0A0A0A;border-color:#0A0A0A;color:#FFFFFF}

/* Accueil : les deux amis sautent une fois */
.hero .p1,.hero .p2{transform-box:fill-box;transform-origin:50% 100%;animation:saut .6s ease-out backwards}
.hero .p2{animation-delay:.18s}
@keyframes saut{from{opacity:0;transform:translateY(-16px) scale(.9)}60%{opacity:1;transform:translateY(0) scale(1.06,.94)}}

/* Résultat : l'anneau se remplit, les étoiles apparaissent */
@property --p{syntax:'<number>';inherits:false;initial-value:0}
.recap .ring{animation:remplir .9s ease-out}
@keyframes remplir{from{--p:0}}
.ring span svg{width:44px;height:44px}
.etoiles{display:flex;gap:4px;margin-bottom:4px}
.etoiles svg{width:30px;height:30px;animation:pop .4s ease-out backwards}
.etoiles svg:nth-child(1){animation-delay:.5s}
.etoiles svg:nth-child(2){animation-delay:.65s}
.etoiles svg:nth-child(3){animation-delay:.8s}
@media (prefers-reduced-motion:reduce){
  .tf .f,.tf .a,.tf .grow,.box,.cell,.ami,.hero .p1,.hero .p2,.recap .ring,.etoiles svg,.dnd-msg{animation:none!important}
  .paires .choice.sel{transform:none}
}

@media (prefers-reduced-motion:reduce){
  .enter,.choice.pop,.choice.shake,.streak{animation:none}
  .sheet,.segs i,.tile,.choice{transition:none}
}
/* Style « Simple » = charte de rprof1.com : blanc, noir, gris, une seule police (Figtree, incluse).

body.simple{
  --bg:#FFFFFF; --surface:#F7F7F7; --card:#FFFFFF; --ink:#0A0A0A; --muted:#737373; --line:#ECECEC; --line-strong:#DCDCDC;
  --focus:#0A0A0A; --primary:#0A0A0A; --primary-ink:#FFFFFF; --sel:#0A0A0A; --sel-bg:#0A0A0A;
  --p-lav:#F7F7F7; --lav-ink:#0A0A0A; --tile-ink:#0A0A0A;
  --ok:#1A7F37; --ok-bg:#E3F5E9; --ok-strong:#1A7F37; --bad:#B42318; --bad-bg:#FCE7E5; --bad-strong:#B42318;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  background:#FFFFFF;color:var(--ink);font-family:"Figtree","Avenir Next",Arial,sans-serif;
  color-scheme:light;
}
body.simple .field input{font-family:inherit}
body.simple h1{font-weight:600;letter-spacing:-.045em;line-height:1}
body.simple .mbox h2,body.simple .sheet-title,body.simple .word{font-weight:600;letter-spacing:-.025em}
body.simple .tile .name{font-weight:600;letter-spacing:-.02em}
body.simple .lead{color:#3C3C3C}
body.simple .hero{display:none}
body.simple .round{background:#FFFFFF;border:1px solid var(--line-strong)}
body.simple .tile{background:var(--surface)!important;border:0;border-radius:16px}
body.simple .tile .ico{background:#FFFFFF}
body.simple .sline .ic{background:var(--surface)}
body.simple .badge,body.simple .scount,body.simple .foot{font-family:var(--mono);letter-spacing:.03em}
body.simple textarea,body.simple input,body.simple select{font-family:inherit}
body.simple .badge{background:transparent;border:1px solid var(--line-strong);font-size:14px}
body.simple .size-pill{background:#FFFFFF;border:1px solid var(--line-strong)}
body.simple .size-pill[aria-pressed="true"]{background:#0A0A0A;border-color:#0A0A0A;color:#FFFFFF;box-shadow:none}
body.simple .btn{background:#FFFFFF;border:1px solid var(--line-strong)}
body.simple .btn.primary{background:#0A0A0A;border-color:#0A0A0A;color:#FFFFFF}
body.simple .def-card,body.simple .recap{background:#FFFFFF;border:1px solid var(--line);border-radius:16px}
body.simple .choice:not(.ok):not(.ko):not(.dim),body.simple .choice.dim:not(.ok):not(.ko){background:#FFFFFF;border:1px solid var(--line-strong);color:var(--ink)}
body.simple .choice.ok,body.simple .choice.ko{border-width:2px}
body.simple .tip{background:var(--surface);border-radius:16px}
body.simple .chip.ok{background:var(--ok-bg);color:var(--ok)} body.simple .chip.ko{background:var(--bad-bg);color:var(--bad)}


body.simple .segs i{height:4px} body.simple .segs i.on{background:#0A0A0A}
body.simple .mbox{border-radius:16px}
body.simple .modal{background:rgba(10,10,10,.25)}
/* Réponses en pastel : contours et rond dans les pastels du site, bouton Continuer noir. */
body.simple .choice.ok{border-color:#86CFA4} body.simple .choice.ko{border-color:#F4A3B4}
body.simple .sheet-ico{background:#86CFA4;color:#0A0A0A} body.simple .sheet.bad .sheet-ico{background:#F4A3B4}
body.simple .sheet-btn,body.simple .sheet.bad .sheet-btn{background:#0A0A0A;color:#FFFFFF}
body.simple .streak{background:var(--surface);color:var(--ink)}
.top{position:relative}
.marque{position:absolute;left:16px;top:50%;transform:translateY(-50%);margin:0;font-family:"Figtree","Avenir Next",Arial,sans-serif;font-size:26px;font-weight:600;letter-spacing:-.04em;line-height:1;color:var(--ink);pointer-events:none}
</style>

/* Ouverture façon rprof1.com : le titre s'affiche, le point tombe, rebondit en changeant
   de couleur (pastels du site) et se pose. Une fois par session, sautée au toucher,
   jamais si l'iPad demande moins d'animations ni pendant les tests automatiques. */
function ouverture(){
  let vu=null;try{vu=sessionStorage.getItem(APP.cle+'-ouverture');sessionStorage.setItem(APP.cle+'-ouverture','1');}catch(e){}
  if(vu||!('animate' in Element.prototype)||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  if(navigator.webdriver&&location.hash!=='#ouverture')return;
  const o=document.createElement('div');o.className='ouverture';o.setAttribute('aria-hidden','true');
  o.innerHTML='<span class="ouverture-mot">'+esc(APP.titre)+'<span class="ouverture-point">.</span></span>';
  document.body.appendChild(o);
  const p=o.querySelector('.ouverture-point');let fini=false;
  const fermer=()=>{if(fini)return;fini=true;o.animate([{opacity:1},{opacity:0}],{duration:280,fill:'forwards'}).finished.then(()=>o.remove());};
  ['pointerdown','keydown'].forEach(t=>addEventListener(t,fermer,{once:true,passive:true}));
  const bas='cubic-bezier(.5,0,1,.6)',haut='cubic-bezier(0,.4,.5,1)';
  p.animate([
    {transform:'translateY(-1.7em) scale(.9,1.15)',opacity:0,color:'#B9A7EE',offset:0},
    {transform:'translateY(-1.7em) scale(.9,1.15)',opacity:1,easing:bas,offset:.02},
    {transform:'translateY(0) scale(.9,1.15)',color:'#8FB6EE',offset:.34},
    {transform:'translateY(0) scale(1.35,.68)',easing:haut,offset:.40},
    {transform:'translateY(-.45em) scale(.95,1.08)',color:'#86CFA4',easing:bas,offset:.58},
    {transform:'translateY(0) scale(1.25,.78)',easing:haut,offset:.70},
    {transform:'translateY(-.14em) scale(1,1)',color:'#E9C95E',easing:bas,offset:.80},
    {transform:'translateY(0) scale(1.1,.9)',color:'#F4A3B4',offset:.88},
    {transform:'translateY(0) scale(1,1)',color:getComputedStyle(p).color,offset:1}
  ],{duration:1150,fill:'backwards'});
  setTimeout(fermer,1400);
}
/* Étiquette « Nouveau » sur le bouton Simple (sans animation) : disparaît dès qu'on touche un style, ou après 3 ouvertures. */

/* ---------- A. Tirage sans répétition, par liste ----------
   cle : nom de la liste (ex. 'trier-2-ferme'), ids : identifiants possibles, n : nombre voulu.
   La liste est épuisée avant de reproposer un identifiant ; les identifiants disparus
   (contenu modifié dans une nouvelle version) sont ignorés. */
function piocheIds(cle,ids,n){
  let reste=store('reste-'+cle);if(!Array.isArray(reste))reste=[];
  reste=reste.filter(id=>ids.indexOf(id)>=0);
  const pris=[];
  while(pris.length<n&&pris.length<ids.length){
    if(!reste.length)reste=shuffle(ids.filter(id=>pris.indexOf(id)<0));
    pris.push(reste.shift());
  }
  store('reste-'+cle,reste);
  return pris;
}

/* ---------- C. Réussites et « Mes … difficiles » ----------
   Les clés sont préfixées par l'activité : 't:vache', 'q:12', 'm:p3'…
   Ne change jamais un identifiant d'une version à l'autre (voir « Données qui survivent aux mises à jour »). */
function listeStockee(nom){const l=store(nom);return Array.isArray(l)?l:[];}
function reussis(){return listeStockee('reussi');}
function noterReussite(cle){const r=reussis();if(r.indexOf(cle)<0){r.push(cle);store('reussi',r);}}
function difficiles(){return listeStockee('difficiles');}
function noterErreur(cle){const d=difficiles();if(d.indexOf(cle)<0){d.push(cle);store('difficiles',d);}}
function retirerDifficile(cle){store('difficiles',difficiles().filter(x=>x!==cle));}

/* ---------- D. Écran « Mes progrès » ----------
   activites : [{nom:'Trier', prefixe:'t', ids:[…], unite:'mot', feminin:false}]
   Un anneau par activité : éléments réussis du premier coup sur le total, « Maîtrisé ✓ » à 100 %.
   Pas de classement, pas de comparaison. */
function ecranProgres(activites,retour){
  header({});
  const r=reussis(),nd=difficiles().length;
  view('<h1>Mes progrès</h1><p class="lead">Une réponse juste du premier coup compte ici.</p>'+
    '<div class="prog">'+activites.map(a=>{
      const tot=a.ids.length,ok=a.ids.filter(id=>r.indexOf(a.prefixe+':'+id)>=0).length,pc=tot?Math.round(ok/tot*100):0;
      const accord=(a.feminin?'réussie':'réussi')+(ok>1?'s':'');
      return '<div class="prow"><div class="ring small" style="--p:'+pc+'"><span>'+pc+'%</span></div>'+
        '<div class="ptxt"><span class="pname">'+esc(a.nom)+(tot&&ok===tot?' <span class="maitrise">Maîtrisé ✓</span>':'')+'</span>'+
        '<span class="small-label">'+ok+' '+esc(a.unite)+(ok>1?'s':'')+' '+accord+' sur '+tot+'.</span></div></div>';
    }).join('')+'</div>'+
    '<div class="tip neutre">'+(ICONS.etoile||'')+'<span>'+(nd?(nd===1?'1 élément à revoir.':nd+' éléments à revoir.'):'Rien à revoir pour le moment.')+'</span></div>'+
    '<div class="actions"><button type="button" class="btn" id="resetBtn">Tout remettre à zéro</button><button type="button" class="btn primary" id="retourBtn">Accueil</button></div>');
  $('#retourBtn').addEventListener('click',retour);
  $('#resetBtn').addEventListener('click',e=>{
    const b=e.currentTarget;
    if(!b.dataset.ok){b.dataset.ok='1';b.textContent='Touche encore pour confirmer';return;}
    store('reussi',[]);store('difficiles',[]);ecranProgres(activites,retour);
  });
}

const pluriel=(n,mot)=>n+' '+mot+(n>1?'s':'');
/* Cadre de 10 : a points bleus. o.ami : les cases vides sont remplies en orange. o.anim : les points apparaissent un à un. */
function cadre(a,o){o=o||{};
  let h='<span class="tf'+(o.anim?' anim':'')+'" role="img" aria-label="'+a+' points sur 10">';
  for(let i=0;i<10;i++){const plein=i<a;h+='<i class="'+(plein?'f':(o.ami?'a':'e'))+'" style="--d:'+(plein?i*60:a*60+150+(i-a)*70)+'ms"></i>';}
  return h+'</span>';}
/* Animation de la réponse : les cases vides se remplissent une à une en orange */
function remplirAmi(tf){$$('i.e',tf).forEach((c,k)=>{c.style.setProperty('--d',(k*90)+'ms');c.classList.remove('e');c.classList.add('a','grow');});}
/* Calculs à revoir : seulement les clés 'c:0' à 'c:10' (les anciennes données inconnues sont ignorées) */
function difficilesC(){return difficiles().filter(k=>/^c:\d+$/.test(k)&&AMIS.indexOf(+k.slice(2))>=0);}

  m.style.animation='none';void m.offsetWidth;m.style.animation='';}

/* ---------- Trouve l'ami : 7 + ? = 10 ---------- */
function choixPour(a){const b=10-a;
  const autres=shuffle([b-1,b+1,b-2,b+2,a].filter((x,i,t)=>x>=0&&x<=10&&x!==b&&t.indexOf(x)===i));
  return shuffle([b,autres[0],autres[1]]);}
function texteHistoire(t,a){return t.replace(/\{a\}/g,a).replace(/\{([^|}]*)\|([^}]*)\}/g,(m,un,pl)=>a>1?pl:un);}
/* Une partie : chaque ami au moins une fois, puis on recommence la liste ; les sortes de calculs tournent. */
function questionsComp(ids,d){
  const types=TYPES_COMP[d];let pile=[];
  return ids.map(a=>{
    if(!pile.length)pile=shuffle(types);
    let t=pile.shift();
    if(t==='histoire'&&(a===0||a===10))t=types[0];
    return {a:a,t:t,h:t==='histoire'?HISTOIRES[rnd(HISTOIRES.length)]:''};
  });
}
function startComp(revoir){
  const d=defiActuel(),n=NB_QUESTIONS[d];
  let ids;
  if(revoir)ids=shuffle(difficilesC().map(k=>+k.slice(2))).slice(0,n);
  else{ids=[];while(ids.length<n){const lot=piocheIds('complement',AMIS,Math.min(AMIS.length,n-ids.length));
    if(ids.length&&lot.length>1&&lot[0]===ids[ids.length-1])lot.push(lot.shift());ids=ids.concat(lot);}}
  if(!ids.length)return renderHome();
  S.sess={revoir:!!revoir,qs:questionsComp(ids,d),i:0,score:0,serie:0,ko:[],defi:d};
  renderComp();
}
function renderComp(){
  const s=S.sess,q=s.qs[s.i],a=q.a,b=10-a,d=s.defi,t=q.t;
  const f=t==='cent'?10:1,A=a*f,B=b*f,T=10*f;   /* « cent » : 70 + 30 = 100 */
  const histoire=t==='histoire'?texteHistoire(q.h,a):'';
  const label=t==='histoire'?histoire:t==='moins'?'Combien font 10 moins '+a+' ?':'Quel nombre manque pour faire '+T+' ?';
  const ecoute=()=>say(t==='histoire'?histoire:t==='moins'?'10 moins '+a+' égale combien ?':t==='egal'?T+' égale '+A+' plus combien ?':t==='gauche'?'Combien plus '+A+' égale '+T+' ?':A+' plus combien égale '+T+' ?');
  header({segs:[s.i,s.qs.length],streak:s.serie,listen:ecoute});
  window.__appli.bonneReponse=String(B); /* crochet pour les tests automatiques */
  const box='<span class="box" id="box">?</span>',ega='<span>=</span>';
  const eq=t==='gauche'?box+'<span>+</span>'+bleu(A)+ega+'<span>'+T+'</span>':
    t==='egal'?'<span>'+T+'</span>'+ega+bleu(A)+'<span>+</span>'+box:
    t==='moins'?'<span>10</span><span>−</span>'+bleu(A)+ega+box:
    t==='histoire'?'<span class="eq-txt">Réponse :</span>'+box:
    bleu(A)+'<span>+</span>'+box+ega+'<span>'+T+'</span>';
  const nums=(d==='3'?AMIS:choixPour(a)).map(x=>x*f);
  const noteAide=pluriel(a,'point')+' '+(a>1?'bleus':'bleu')+'. Compte les cases vides.'+(f===10?'<br>Chaque point vaut 10.':'');
  view('<span class="badge">'+(s.revoir?'À revoir · ':'')+'Question '+(s.i+1)+' sur '+s.qs.length+'</span>'+
    '<p class="q-label'+(t==='histoire'?' histoire':'')+'">'+esc(label)+'</p>'+
    '<div class="eq'+(t==='histoire'?' petit':'')+'">'+eq+'</div>'+
    '<div class="tf-zone" id="tfz">'+(d==='1'?cadre(a,{anim:true}):'')+'</div>'+
    '<div class="answers '+(d==='3'?'pad':'trois')+'">'+nums.map(n=>'<button type="button" class="choice num" data-rep="'+n+'">'+n+'</button>').join('')+'</div>'+
    (d!=='1'?'<div class="actions inline" id="aide"><button type="button" class="btn" id="aideBtn">Besoin d’aide ?</button></div>':''));
  const aide=$('#aideBtn');
  if(aide)aide.addEventListener('click',()=>{$('#tfz').innerHTML=cadre(a,{anim:true})+'<p class="note">'+noteAide+'</p>';$('#aide').remove();});
  $$('.choice',main).forEach(btn=>btn.addEventListener('click',()=>{
    const n=+btn.dataset.rep,juste=n===B,cle='c:'+a;
    const calc=t==='moins'?'10 − '+a+' = '+b:t==='gauche'?B+' + '+A+' = '+T:A+' + '+B+' = '+T;
    $$('.choice',main).forEach(x=>{x.disabled=true;if(+x.dataset.rep===B)x.classList.add('ok');else if(x!==btn)x.classList.add('dim');});
    const bx=$('#box');bx.textContent=n;bx.classList.add(juste?'ok':'ko');
    if($('#aide'))$('#aide').remove();
    /* Le cadre montre l'ami : les cases vides se remplissent en orange */
    $('#tfz').innerHTML=cadre(a,{anim:!$('#tfz .tf')});
    remplirAmi($('#tfz .tf'));
    if(juste){btn.classList.add('pop');s.score++;s.serie++;noterReussite(cle);if(s.revoir)retirerDifficile(cle);
      $('#tfz').insertAdjacentHTML('beforeend','<p class="note">'+bleu(A)+' + '+orange(B)+' = '+T+'</p>');}
    else{btn.classList.add('ko','shake');s.serie=0;if(s.ko.indexOf(calc)<0)s.ko.push(calc);noterErreur(cle);
      $('#tfz').insertAdjacentHTML('beforeend','<p class="note">Avec '+n+' : '+A+' + '+n+' = '+(A+n)+'. '+(A+n>T?'C’est trop':'Ce n’est pas assez')+'.<br>Il manque '+orange(B)+' pour faire '+T+'.</p>');}
    header({segs:[s.i+1,s.qs.length],streak:s.serie,listen:ecoute});
    showSheet(juste,juste?'Bravo !':'Pas tout à fait',juste?calc+'.':'La réponse est '+B+'. '+calc+'.',()=>{s.i++;if(s.i<s.qs.length)renderComp();else finComp();});
  }));
}
function finComp(){const s=S.sess;
  recap({score:s.score,n:s.qs.length,aRevoir:s.ko,rejouer:()=>startComp(s.revoir&&difficilesC().length>0)});}

/* ---------- Les paires : touche 2 nombres qui font 10 ---------- */
function ligneDePaires(p,nb){
  for(;;){const row=[p,10-p];while(row.length<nb)row.push(rnd(11));
    let c=0;for(let i=0;i<nb;i++)for(let j=i+1;j<nb;j++)if(row[i]+row[j]===10)c++;
    if(c===1)return shuffle(row);}}
function startPaires(){
  const d=defiActuel();
  const n=NB_LIGNES[d];let ids=[];while(ids.length<n)ids=ids.concat(piocheIds('paires',PAIRES,Math.min(PAIRES.length,n-ids.length)));
  S.sess={lignes:ids.map(p=>({p:p,nums:ligneDePaires(p,PAIRES_NB[d])})),i:0,score:0,serie:0,ko:[]};
  renderPaires();
}
function renderPaires(){
  const s=S.sess,L=s.lignes[s.i],nums=L.nums,nb=nums.length;
  let paire=[];for(let i=0;i<nb;i++)for(let j=i+1;j<nb;j++)if(nums[i]+nums[j]===10)paire=[i,j];
  window.__appli.paire=paire; /* crochet pour les tests automatiques */
  s.sel=null;s.essais=0;s.bloque=false;
  const consigne='Touche les 2 nombres qui font 10 ensemble.';
  header({segs:[s.i,s.lignes.length],streak:s.serie,listen:()=>say(consigne)});
  view('<span class="badge">Ligne '+(s.i+1)+' sur '+s.lignes.length+'</span>'+
    '<p class="q-label">'+consigne+'</p>'+
    '<div class="paires" style="--cols:'+(nb%3===0?3:4)+'">'+nums.map((n,k)=>'<button type="button" class="choice num" data-k="'+k+'">'+n+'</button>').join('')+'</div>'+
    '<div class="dnd-msg" id="msg" role="status" hidden></div><div class="tf-zone" id="tfz"></div>');
  const btns=$$('.choice',main);
  const suite=()=>{s.i++;if(s.i<s.lignes.length)renderPaires();else finPaires();};
  btns.forEach(btn=>btn.addEventListener('click',()=>{
    if(s.bloque)return;
    const k=+btn.dataset.k;
    if(s.sel===null){s.sel=k;btn.classList.add('sel');return;}
    if(s.sel===k){btn.classList.remove('sel');s.sel=null;return;}
    const i=s.sel,x=nums[i],y=nums[k];s.sel=null;btns[i].classList.remove('sel');
    if(x+y===10){
      btns.forEach(b=>{b.disabled=true;if(b!==btns[i]&&b!==btns[k])b.classList.add('dim');});
      [btns[i],btns[k]].forEach(b=>b.classList.add('ok','pop'));
      $('#msg').hidden=true;
      $('#tfz').innerHTML=cadre(x,{anim:true,ami:true})+'<p class="note">'+bleu(x)+' + '+orange(y)+' = 10</p>';
      if(s.essais===0){s.score++;s.serie++;noterReussite('p:'+L.p);}
      header({segs:[s.i+1,s.lignes.length],streak:s.serie,listen:()=>say(x+' plus '+y+' égale 10.')});
      showSheet(true,'Bravo !',x+' + '+y+' = 10.',suite);
      return;
    }
    s.essais++;s.serie=0;
    if(s.essais===1){s.ko.push(L.p+' + '+(10-L.p)+' = 10');noterErreur('c:'+L.p);}
    [btns[i],btns[k]].forEach(b=>b.classList.add('ko','shake'));
    if(s.essais>=2){
      s.bloque=true;btns.forEach(b=>b.disabled=true);$('#msg').hidden=true;
      const pa=nums[paire[0]],pb=nums[paire[1]];
      setTimeout(()=>{[btns[i],btns[k]].forEach(b=>b.classList.remove('ko','shake'));
        btns.forEach((b,j)=>{if(paire.indexOf(j)>=0)b.classList.add('ok','pop');else b.classList.add('dim');});
        $('#tfz').innerHTML=cadre(pa,{anim:true,ami:true})+'<p class="note">'+bleu(pa)+' + '+orange(pb)+' = 10</p>';},700);
      header({segs:[s.i+1,s.lignes.length],streak:0,listen:()=>say(pa+' plus '+pb+' égale 10.')});
      showSheet(false,'Pas tout à fait','La bonne paire est '+pa+' + '+pb+' = 10.',suite);
    } else {
      s.bloque=true;
      const need=10-x,existe=nums.some((v,j)=>v===need&&j!==i);
      message('ko',x+' + '+y+' = '+(x+y)+'. '+(existe?'Pour faire 10 avec '+x+', il faut '+need+'. Cherche le '+need+' !':'Pour faire 10 avec '+x+', il faut '+need+'. Il n\u2019y a pas de '+need+' ici : essaie un autre nombre.'));
      setTimeout(()=>{[btns[i],btns[k]].forEach(b=>b.classList.remove('ko','shake'));s.bloque=false;},900);
    }
  }));
}
function finPaires(){const s=S.sess,n=s.lignes.length;
  recap({score:s.score,n:n,aRevoir:s.ko,rejouer:startPaires,
    ligne:pluriel(s.score,'paire')+' '+(s.score>1?'trouvées':'trouvée')+' du premier coup sur '+n+'.'});}

/* ---------- Le labyrinthe : passer seulement par les calculs qui font 10 ---------- */
/* Nombres (de 0 à 10) dont la somme vaut t : 2 nombres, ou 3 nombres (sans 0) au grand défi */
function termes(t,trois){
  for(;;){if(!trois){const a=rnd(11),b=t-a;if(b>=0&&b<=10)return [a,b];}
    else{const a=1+rnd(8),b=1+rnd(8),c=t-a-b;if(c>=1&&c<=8)return [a,b,c];}}}
function startLaby(){
  const R=LABY[defiActuel()][0],C=LABY[defiActuel()][1];
  const pas=shuffle(Array(C-1).fill('d').concat(Array(R-1).fill('b')));
  const chemin=['0,0'];let r=0,c=0;pas.forEach(m=>{if(m==='d')c++;else r++;chemin.push(r+','+c);});
  const cases=[],trois=defiActuel()==='3';
  for(let y=0;y<R;y++)for(let x=0;x<C;x++){
    const k=y+','+x;let cl;
    if(!y&&!x)cl={type:'depart'};
    else if(y===R-1&&x===C-1)cl={type:'arrivee'};
    else{const t=chemin.indexOf(k)>=0?10:Math.random()<.5?9:11;cl={type:'op',n:termes(t,trois&&Math.random()<.5)};}
    cl.k=k;cases.push(cl);
  }
  S.sess={R:R,C:C,cases:cases,trace:['0,0'],err:0,ko:[],fini:false};
  window.__appli.chemin=chemin; /* crochet pour les tests automatiques */
  const consigne='Va du départ à l\u2019arrivée. Touche seulement les calculs qui font 10.';
  header({title:'Le labyrinthe',listen:()=>say(consigne)});
  view('<p class="q-label">'+consigne+'</p>'+
    '<div class="maze'+(trois?' trois':'')+'" style="--cols:'+C+'">'+cases.map(cl=>'<button type="button" class="cell'+(cl.type!=='op'?' mark':'')+'" data-k="'+cl.k+'">'+
      (cl.type==='depart'?'Départ':cl.type==='arrivee'?'Arrivée':cl.n.join(' + '))+'</button>').join('')+'</div>'+
    '<div class="dnd-msg" id="msg" role="status" hidden></div>');
  majLaby();
  $$('.cell',main).forEach(b=>b.addEventListener('click',()=>labyTap(b)));
}
function majLaby(){const s=S.sess,last=s.trace[s.trace.length-1];
  $$('.cell',main).forEach(b=>{const k=b.dataset.k;b.classList.toggle('on',s.trace.indexOf(k)>=0);b.classList.toggle('last',k===last&&!s.fini);});}
function labyTap(btn){
  const s=S.sess,k=btn.dataset.k;
  if(s.fini||s.trace.indexOf(k)>=0)return;
  const rc=k.split(',').map(Number),lrc=s.trace[s.trace.length-1].split(',').map(Number);
  if(Math.abs(rc[0]-lrc[0])+Math.abs(rc[1]-lrc[1])!==1){message('info','Avance case par case : touche une case à côté de ta dernière case.');return;}
  const cl=s.cases.find(x=>x.k===k);
  if(cl.type==='arrivee'){
    s.fini=true;s.trace.push(k);majLaby();$('#msg').hidden=true;
    /* Le chemin s'allume en vert, de proche en proche */
    s.trace.forEach((t,j)=>{const b=$('.cell[data-k="'+t+'"]',main);b.style.setProperty('--d',(j*80)+'ms');b.classList.remove('on');b.classList.add('win');});
    setTimeout(()=>finLaby(s),s.trace.length*80+600);
    return;
  }
  const somme=cl.n.reduce((x,y)=>x+y,0),txt=cl.n.join(' + ');
  if(somme===10){s.trace.push(k);majLaby();message('ok',txt+' = 10. Tu avances !');}
  else{
    s.err++;const t=txt+' = '+somme;if(s.ko.indexOf(t)<0)s.ko.push(t);
    btn.classList.remove('ko');void btn.offsetWidth;btn.classList.add('ko');
    setTimeout(()=>btn.classList.remove('ko'),1000);
    message('ko',t+'. Ce n\u2019est pas 10.'+(cl.n.length===2?' Pour faire 10 avec '+cl.n[0]+', il faut '+(10-cl.n[0])+'.':' Compte bien chaque nombre.'));
  }
}
/* s = la partie qui vient de finir : si l'élève a relancé entre-temps, on ne montre rien */
function finLaby(s){if(s!==S.sess||!s.cases||!main.contains($('.maze',main)))return;
  const n=s.trace.length-2;
  recap({pc:100,label:ICONS.trophee,etoiles:s.err===0,titre:s.err===0?'Bravo !':'Bien joué !',aRevoir:s.ko,rejouer:startLaby,
    ligne:'Tu as trouvé le chemin : '+pluriel(n,'calcul')+' qui font 10.'+(s.err?' '+pluriel(s.err,'erreur')+'.':'')});}

/* ---------- Résultat commun ----------
   « Aucune erreur » seulement s'il n'y a rien à revoir (donc score === n). */
function recap(o){
  const pc=o.pc!==undefined?o.pc:(o.n?Math.round(o.score/o.n*100):0);
  const titre=o.titre||((pc>=80?'Bravo':pc>=50?'Bien joué':'Continue')+' !');
  const ligne=o.ligne||(o.score+(o.score>1?' bonnes réponses':' bonne réponse')+' sur '+o.n+'.');
  const etoiles=o.etoiles!==undefined?o.etoiles:pc>=80;
  header({title:'Résultat',listen:()=>say(titre+' '+ligne)});
  view('<div class="recap"><div class="recap-head"><div class="ring" style="--p:'+pc+'"><span>'+(o.label||o.score+'/'+o.n)+'</span></div>'+
    '<div>'+(etoiles?'<div class="etoiles">'+ICONS.etoile+ICONS.etoile+ICONS.etoile+'</div>':'')+'<h1>'+esc(titre)+'</h1><p class="lead">'+esc(ligne)+'</p></div></div>'+
    (o.aRevoir.length?'<p class="small-label">À revoir</p><div class="chips">'+o.aRevoir.map(t=>'<span class="chip ko">'+esc(t)+'</span>').join('')+'</div>':'<p class="small-label">Aucune erreur. Super !</p>')+
    '</div><div class="tip">'+ICONS.photo+'<span>Fais une capture d\u2019écran pour montrer ton travail à ton professeur.</span></div>'+
    '<div class="actions"><button type="button" class="btn primary" id="againBtn">Rejouer</button><button type="button" class="btn" id="homeBtn2">Accueil</button></div>');
  $('#againBtn').addEventListener('click',o.rejouer);$('#homeBtn2').addEventListener('click',renderHome);
}


/* =====================================================================
   7. AIDE PAS-À-PAS
   ===================================================================== */
const H={i:0};
function openHelp(){H.i=0;renderHelp();$('#helpModal').classList.add('on');}
function closeHelp(){$('#helpModal').classList.remove('on');}
function renderHelp(){const n=ETAPES.length,e=ETAPES[H.i];
  $('#helpSegs').innerHTML=ETAPES.map((_,k)=>'<i class="'+(k<=H.i?'on':'')+'"></i>').join('');
  $('#helpBody').innerHTML='<h2>'+esc(e.titre)+'</h2><div class="slines" style="margin-top:14px">'+e.lignes.map(l=>line(l[0],l[1])).join('')+'</div>';
  $('#helpCount').textContent='Étape '+(H.i+1)+' sur '+n;
  $('#helpPrev').style.visibility=H.i?'visible':'hidden';
  $('#helpNext').textContent=H.i===n-1?'J\u2019ai compris':'Suivant';}
function helpGo(d){if(H.i+d>=ETAPES.length)return closeHelp();H.i=Math.max(0,H.i+d);renderHelp();}
$('#helpNext').addEventListener('click',()=>helpGo(1));
$('#helpPrev').addEventListener('click',()=>helpGo(-1));
$('#helpClose').addEventListener('click',closeHelp);
let tx=null;const mb=$('#helpModal .mbox');
mb.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
mb.addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>60)helpGo(dx<0?1:-1);});

/* =====================================================================
   8. ADAPTATION PORTRAIT / PAYSAGE
   Calculer les tailles d'après l'espace RÉELLEMENT disponible (clientWidth/Height),
   jamais d'après une estimation. Compléter ici pour les plateaux, grilles, etc.
   ===================================================================== */
function layout(){
  const W=innerWidth,H=innerHeight;
  document.body.classList.toggle('portrait',H>W*1.05);
  /* Exemple : const zone=$('.zone'); if(zone){const c=Math.floor(Math.min(zone.clientWidth/10,zone.clientHeight/8));document.documentElement.style.setProperty('--cell',c+'px');} */
}
let lt=null;const ro=new ResizeObserver(()=>{cancelAnimationFrame(lt);lt=requestAnimationFrame(layout);});
ro.observe(document.body);
addEventListener('orientationchange',()=>setTimeout(layout,250));

ouverture();
renderHome();
})();
</script>
